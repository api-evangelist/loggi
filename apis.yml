name: Loggi

description: 'Loggi is the largest private shipping and last-mile logistics company in Brazil, operating its own delivery network across more
  than 4,000 municipalities. Loggi publishes a REST developer platform (docs.api.loggi.com) that lets partner platforms and integrators estimate
  freight prices and delivery times, create single or multiple shipments (synchronously or asynchronously), generate Loggi shipping labels, update
  or cancel packages, retrieve package details, track packages in real time, and receive delivery status updates via webhooks. Authentication
  is OAuth2 client-credentials style (client_id/client_secret exchanged for a JWT). Backed by Fifth Wall, GGV Capital and SoftBank Vision Fund.
  Sector: logistics.'

