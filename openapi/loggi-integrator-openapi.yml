openapi: 3.0.0
info:
  title: Integrator
  version: v1
  description: Disponibiliza a associação entre um Integrador e uma Company.
servers:
- url: https://stg.api.loggi.com
- url: https://api.loggi.com
paths:
  /v1/integrator/activate:
    post:
      summary: Ativar/Desativar Integrador
      description: ''
      operationId: CreateIntegratorCompany
      security:
      - OAuth2: []
      responses:
        '200':
          description: Operação de associação feita com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1IntegratorCompanyResponse'
        '400':
          description: Mensagem do cliente não segue a especificação
          content:
            application/json:
              example:
                code: 3
                message: Mensagem do cliente não segue a especificação
                details: []
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '401':
          description: Falha de autenticação
          content:
            application/json:
              example:
                code: 16
                message: Falha de autenticação
                details: []
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '403':
          description: Sem autorização para acessar o serviço
          content:
            application/json:
              example:
                code: 7
                message: Falha de autenticação
                details: []
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '404':
          description: Recurso não encontrado
          content:
            application/json:
              example:
                code: 5
                message: Recurso não encontrado
                details: []
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '429':
          description: Requisições massivas bloqueadas
          content:
            application/json:
              example:
                code: 8
                message: Requisições massivas bloqueadas
                details: []
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '500':
          description: Erro interno
          content:
            application/json:
              example:
                code: 13
                message: Erro interno
                details: []
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '503':
          description: Serviço temporariamente indisponível
          content:
            application/json:
              example:
                code: 14
                message: Serviço temporariamente indisponível
                details: []
              schema:
                $ref: '#/components/schemas/ErrorMessage'
      parameters:
      - name: integration_code
        in: query
        required: true
        description: Código numérico fornecido pela Loggi para identificação do Integrador.
        schema:
          type: string
      - name: active
        in: query
        required: true
        description: Valor booleano que define a ativação ou não do Integrador com a Company. _true_ para ativar ou _false_ para desativar.
        schema:
          type: boolean
      tags:
      - IntegratorCompanyAPI
components:
  securitySchemes:
    OAuth2:
      type: oauth2
      description: Autenticação OAuth 2.0 para clientes da API.
      flows:
        clientCredentials:
          tokenUrl: https://api.loggi.com/oauth2/token
          scopes: {}
  schemas:
    v1IntegratorCompanyResponse:
      type: object
      properties:
        companyId:
          type: integer
          format: int64
          description: Código numérico referente ao Id da Company.
          example: 3214
    ErrorMessage:
      type: object
      properties:
        code:
          type: integer
          format: int32
          description: 'Código numérico referente à falha.

            CANCELLED = 1

            UNKNOWN = 2

            INVALID_ARGUMENT = 3

            DEADLINE_EXCEEDED = 4

            NOT_FOUND = 5

            ALREADY_EXISTS = 6

            PERMISSION_DENIED = 7

            RESOURCE_EXHAUSTED = 8

            FAILED_PRECONDITION = 9

            ABORTED = 10

            OUT_OF_RANGE = 11

            UNIMPLEMENTED = 12

            INTERNAL = 13

            UNAVAILABLE = 14

            DATA_LOSS = 15

            UNAUTHENTICATED = 16'
          example: 14
        message:
          type: string
          description: Texto pequeno informativo sobre a falha.
          example: Requisição com credenciais inválidas.
        details:
          type: array
          description: Detalhes sobre a falha. Nesta versão da API ainda não está sendo retornado, mas deve ser considerado um array de objetos de tipos distintos.
          items: {}
          example: []
