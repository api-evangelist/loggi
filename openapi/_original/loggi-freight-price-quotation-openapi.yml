components:
  securitySchemes:
    OAuth2:
      type: oauth2
      description: Autenticação OAuth 2.0 para clientes da API.
      flows:
        clientCredentials:
          tokenUrl: https://api.loggi.com/oauth2/token
          scopes: {}
  schemas:
    QuoteRequest:
      type: object
      required:
      - shipFrom
      - shipTo
      properties:
        shipFrom:
          type: object
          nullable: false
          oneOf:
          - type: object
            properties:
              correios:
                type: object
                required:
                - logradouro
                - cep
                - cidade
                - uf
                properties:
                  logradouro:
                    type: string
                    minLength: 1
                    maxLength: 128
                    description: Nome da rua. Tamanho mínimo 1 caractere e Tamanho máximo 128 caracteres.
                    example: R. Liberdade
                  numero:
                    type: string
                    minLength: 0
                    maxLength: 8
                    description: Número do endereço. Tamanho máximo 8 caracteres. Caso não possua número, informar com os valores S/N ou s/n
                    example:
                    - 2400
                    - S/N
                    - s/n
                  complemento:
                    type: string
                    minLength: 0
                    maxLength: 128
                    description: Informações adicionais para facilitar a localização. Tamanho máximo 128 caracteres.
                    example: apto 42, em frente ao lava-jato
                  bairro:
                    type: string
                    minLength: 1
                    maxLength: 64
                    description: Para endereços de Brasília, procure mais informações nos Correios. Em casos que seja usado regiões adminstrativas e se existir bairro, informe entre parentêses. Tamanho mínimo 1 caractere e Tamanho máximo 64 caracteres.
                    example: Bonsucesso
                  cep:
                    type: string
                    minLength: 8
                    maxLength: 8
                    description: CEP do endereço com 8 dígitos.
                    example: 30622580
                  cidade:
                    type: string
                    minLength: 1
                    maxLength: 32
                    description: Cidade do endereço. Tamanho mínimo 1 caractere e Tamanho máximo 32 caracteres.
                    example: Belo Horizonte
                  uf:
                    type: string
                    minLength: 2
                    maxLength: 2
                    description: Unidade federativa com dois caracteres.
                    example: MG
                description: Objeto que contém informações detalhadas do endereço compatível com o formato da API dos Correios.
          - type: object
            properties:
              lines:
                type: object
                required:
                - addressLine1
                - postalCode
                - city
                - state
                properties:
                  addressLine1:
                    type: string
                    minLength: 1
                    maxLength: 256
                    description: Primeira linha que contempla os dados do endereço. Tamanho mínimo 1 caractere e Tamanho máximo 256 caracteres.
                    example: Alameda Santos, 2400 - Jardim Paulista
                  addressLine2:
                    type: string
                    minLength: 0
                    maxLength: 256
                    description: Segunda linha que complementa os dados de endereço descritos em addressLine1. Tamanho máximo 256 caracteres.
                    example: Bela Vista
                  postalCode:
                    type: string
                    minLength: 1
                    maxLength: 16
                    description: Código postal do endereço. Tamanho mínimo 1 caractere e Tamanho máximo 16 caracteres.
                    example: 1100651
                  city:
                    type: string
                    minLength: 1
                    maxLength: 32
                    description: Cidade do endereço. Tamanho mínimo 1 caractere e Tamanho máximo 32 caracteres.
                    example: São Paulo
                  state:
                    type: string
                    minLength: 1
                    maxLength: 32
                    description: Estado do Endereço. Tamanho mínimo 1 caractere e Tamanho máximo 32 caracteres.
                    example: São Paulo
                  country:
                    type: string
                    minLength: 1
                    maxLength: 100
                    description: País do endereço.  Tamanho mínimo 1 caractere e Tamanho máximo 100 caracteres.
                    example: Brasil
                description: Representação alternativa de endereços utilizando duas linhas e outros componentes.
          - type: object
            properties:
              widget:
                type: object
                required:
                - address
                properties:
                  address:
                    type: string
