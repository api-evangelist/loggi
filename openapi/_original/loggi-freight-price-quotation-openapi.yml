openapi: 3.0.1
info:
  title: Freight Price Quotation
  version: v1
  description: Cotação de preços e prazos de frete.
servers:
- url: https://stg.api.loggi.com
- url: https://api.loggi.com
paths:
  /v1/companies/{company_id}/quotations:
    post:
      tags:
      - QuotationAPI
      summary: Criar Cotação
      description: '### Sobre esta API:

        Esta API disponibiliza opções de preços e prazos da Loggi nas plataformas parceiras, em tempo real, conforme as características do envio e do parceiro e informações de companyId, shipFrom, shipTo, packages, pickupTypes ou externalServiceIds (SISUs).


        ### Mais alguns detalhes:

        Mesmo com poucas informações preenchidas, a API disponibiliza os preços e os prazos mais adequados ao parceiro. Ainda assim, para obter um retorno de estimativa de preço e prazo mais preciso, recomendamos o preenchimento de todos os campos obrigatórios.


        A cotação de preços é feita levando em consideração:

        - envio - origem e destino;

        - pacote - pesos, dimensões e características;

        - perfil do parceiro.

        - tipo de coleta.'
      operationId: Quote
      security:
      - OAuth2: []
      parameters:
      - name: company_id
        in: path
        required: true
        description: Código numérico fornecido pela Loggi para identificar o cliente.
        schema:
          type: string
      requestBody:
        content:
          application/json:
            examples:
              correios:
                value:
                  shipFrom:
                    correios:
                      logradouro: Alameda Santos
                      numero: '2400'
                      complemento: 10 andar
                      bairro: Jardim Paulista
                      cep: '1419100'
                      cidade: São Paulo
                      uf: SP
                  shipTo:
                    correios:
                      logradouro: Alameda Santos
                      numero: '2400'
                      complemento: 11 Andar
                      bairro: Jardim Paulista
                      cep: 01418200
                      cidade: São Paulo
                      uf: SP
                  packages:
                  - weightG: 12000
                    lengthCm: 55
                    widthCm: 55
                    heightCm: 100
                    goodsValue:
                      currencyCode: BRL
                      units: 87
                      nanos: 350000000
                  - weightG: 12500
                    lengthCm: 50
                    widthCm: 100
                    heightCm: 100
                    goodsValue:
                      currencyCode: BRL
                      units: 105
                      nanos: 350000000
                  pickupTypes:
                  - PICKUP_TYPE_SPOT
                  externalServiceIds:
                  - PDEL-DTED-LEXP-CDOR-0001
              lines:
                value:
                  shipFrom:
                    lines:
                      addressLine1: Alameda Santos, 2400 - Jardim Paulista
                      addressLine2: Bela Vista
                      postalCode: 01418200
                      city: São Paulo
                      state: SP
                      country: Brasil
                  shipTo:
                    lines:
                      addressLine1: Alameda Santos, 2500 - Jardim Paulista
                      addressLine2: Bela Vista
                      postalCode: 01418200
                      city: São Paulo
                      state: SP
                      country: Brasil
                  packages:
                  - weightG: 12000
                    lengthCm: 55
                    widthCm: 55
                    heightCm: 100
                    goodsValue:
                      currencyCode: BRL
                      units: 87
                      nanos: 350000000
                  - weightG: 12500
                    lengthCm: 50
                    widthCm: 100
                    heightCm: 100
                    goodsValue:
                      currencyCode: BRL
                      units: 105
                      nanos: 350000000
                  pickupTypes:
                  - PICKUP_TYPE_SPOT
                  externalServiceIds:
                  - PDEL-DTED-LEXP-CDOR-0001
              widget:
                value:
                  shipFrom:
                    widget:
                      address: Alameda Santos, 2400 - Jardim Paulista
                      complement: 8º andar
                      placesApiInfo:
                        placeId: ChIJgUbEo8cfqokR5lP9_Wh_DaM
                        sessionId: 442d443e-0163-4ca8-a907-7319825548d8
                      userContext:
                        userIp: 127.0.0.1
                        position:
                          latitude: -23.557
                          longitude: -46.662
                  shipTo:
                    widget:
                      address: Alameda Santos, 2400 - Jardim Paulista
                      complement: 8º andar
                      placesApiInfo:
                        placeId: ChIJgUbEo8cfqokR5lP9_Wh_DaM
                        sessionId: 442d443e-0163-4ca8-a907-7319825548d8
                      userContext:
                        userIp: 127.0.0.1
                        position:
                          latitude: -23.557
                          longitude: -46.662
                  packages:
                  - weightG: 12000
                    lengthCm: 55
                    widthCm: 55
                    heightCm: 100
                    goodsValue:
                      currencyCode: BRL
                      units: 87
                      nanos: 350000000
                  - weightG: 12500
                    lengthCm: 50
                    widthCm: 100
                    heightCm: 100
                    goodsValue:
                      currencyCode: BRL
                      units: 105
                      nanos: 350000000
                  pickupTypes:
                  - PICKUP_TYPE_SPOT
                  externalServiceIds:
                  - PDEL-DTED-LEXP-CDOR-0001
            schema:
              $ref: '#/components/schemas/QuoteRequest'
        required: true
      responses:
        '200':
          description: 'Quotation criada com sucesso.


            Para cada pacote fornecido na requisição, uma lista de "quotations" é retornada no response.

            Caso a Loggi não seja capaz de realizar o serviço para um dos pacotes informados, uma lista de "quotations" vazia será retornada.'
